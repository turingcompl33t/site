{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="section-intro">{{ . }}</div>{{ end }}
  {{/* `org` is optional - set it for professional work, omit for personal. */}}
  {{ partial "dated-items.html" (dict
    "pages" .Pages.ByDate.Reverse
    "metaKeys" (slice "org")
  ) }}
{{ end }}
