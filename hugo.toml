baseURL = 'https://example.com/'
locale = 'en-us'
title = 'Kyle Dotterrer'
enableRobotsTXT = true

[params]
  description = 'Notes on software engineering, AI, and security.'
  author = 'Kyle Dotterrer'
  # Shown in the footer. Leave empty to omit.
  email = ''
  github = ''

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  style = 'algol_nu'
  tabWidth = 2

[taxonomies]
  tag = 'tags'

[menus]
  [[menus.main]]
    name = 'Essays'
    pageRef = '/essays'
    weight = 10
  [[menus.main]]
    name = 'Publications'
    pageRef = '/publications'
    weight = 20
  [[menus.main]]
    name = 'Talks'
    pageRef = '/talks'
    weight = 30
  [[menus.main]]
    name = 'Projects'
    pageRef = '/projects'
    weight = 35

# HTML only - no feeds.
[outputs]
  home = ['html']
  section = ['html']
  taxonomy = ['html']
  term = ['html']
