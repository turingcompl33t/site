baseURL = 'https://kyledotterrer.com/'
locale = 'en-us'
title = 'Kyle Dotterrer'
enableRobotsTXT = true

[params]
  description = 'Notes on software engineering, AI, and security.'
  author = 'Kyle Dotterrer'
  # Shown in the footer. Leave empty to omit.
  email = ''
  github = 'turingcompl33t'
  scholar = 'CLqV388AAAAJ'
  linkedin = 'kyle-dotterrer'

[markup.goldmark.renderer]
  unsafe = true

# Pass math through Goldmark untouched; layouts/_markup/render-passthrough.html
# renders it to HTML with KaTeX at build time.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

[markup.highlight]
  noClasses = false
  style = 'algol_nu'
  tabWidth = 2

[taxonomies]
  tag = 'tags'

[menus]
  [[menus.main]]
    name = 'Projects'
    pageRef = '/projects'
    weight = 10
  [[menus.main]]
    name = 'Research'
    pageRef = '/research'
    weight = 20
  [[menus.main]]
    name = 'Writing'
    pageRef = '/writing'
    weight = 30

# HTML only - no feeds.
[outputs]
  home = ['html']
  section = ['html']
  taxonomy = ['html']
  term = ['html']

# Sidebar table of contents on writing posts (layouts/_partials/toc.html).
[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false
